[package]
name = "gpg-bridge"
version = "0.2.0"
authors = ["Jay Lee <busyjaylee@gmail.com>"]
edition = "2024"
rust-version = "1.100"
description = "A bridge connects openssh-portable and GnuPG on Windows."

[dependencies]
log = "0.4"
tokio = { version = "1.8", features = ["net", "sync", "rt", "io-util", "process", "fs", "time"] }
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
